# CONFIGURATION -------------------------
_min_copier_version: "9"
_envops:
    autoescape: false
    keep_trailing_newline: true
_subdirectory: template
_templates_suffix: .jinja
_preserve_symlinks: true
_skip_if_exists:
    - CHANGELOG.md

# PROMPT --------------------------------
extension_name:
    type: str
    help: Extension name (lowercase, alphanumerical and underscore only, no accents)

extension_description:
    type: str
    help: One-line description of the extension

module_name:
    type: str
    help: The name of the Python module containing the extension
    default: "skybrush_ext_{{extension_name}}"

extension_class_name:
    type: str
    help: The name of the Python class implementing the extension
    default: "{{extension_name | capitalize}}Extension"

user_name:
    type: str
    help: Your full name

user_email:
    type: str
    help: Your email
